# پروژه‌ی Xcode از روی همین فایل با XcodeGen ساخته می‌شود (فایل .xcodeproj در ریپو نیست).
# ساخت محلی روی مک: brew install xcodegen && xcodegen generate
name: Shkala
options:
  bundleIdPrefix: com.shkala
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fa
  createIntermediateGroups: true
# نقشه‌ی انتخاب لوکیشن: همون موتور MapLibre اپ اندروید (با استایل نقشه‌ی نشان)
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.3"
    CURRENT_PROJECT_VERSION: "24"
targets:
  Shkala:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Shkala
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shkala.app
        PRODUCT_NAME: Shkala
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Shkala/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
    info:
      path: Shkala/Info.plist
      properties:
        CFBundleDisplayName: shkala
        CFBundleName: Shkala
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fa
        CFBundleLocalizations: [fa]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # ذخیره‌ی عکس محصول در گالری (دکمه‌ی دانلودِ لایت‌باکس)
        NSPhotoLibraryAddUsageDescription: برای ذخیره‌ی تصویر محصول در گالری گوشی
        # بررسی دوره‌ای اعلان‌های اپ در پس‌زمینه (PushSync - BGAppRefreshTask)
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.shkala.app.push-refresh
        UIAppFonts:
          - iranyekan_regular.ttf
          - iranyekan_bold.ttf
          - remixicon.ttf
        UILaunchScreen:
          UIColorName: SplashRed
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
