# پروژه‌ی Xcode از روی همین فایل با XcodeGen ساخته می‌شود (فایل .xcodeproj در ریپو نیست).
# ساخت محلی روی مک: brew install xcodegen && xcodegen generate
name: Shkala
options:
  bundleIdPrefix: com.shkala
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fa
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shkala:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Shkala
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shkala.app
        PRODUCT_NAME: Shkala
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Shkala/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
    info:
      path: Shkala/Info.plist
      properties:
        CFBundleDisplayName: سیما حفاظ خزر
        CFBundleName: Shkala
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fa
        CFBundleLocalizations: [fa]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - iranyekan_regular.ttf
          - iranyekan_bold.ttf
          - remixicon.ttf
        UILaunchScreen:
          UIColorName: SplashRed
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
